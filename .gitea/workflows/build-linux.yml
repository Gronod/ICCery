name: Build Linux Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: "true"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: "src-tauri -> target"

      - name: Cache APT Packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-packages-v1
          restore-keys: |
            ${{ runner.os }}-apt-packages-

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file patchelf xdg-utils squashfs-tools zsync \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxss-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev
          sudo apt-get install --no-install-recommends -y libfuse2 || sudo apt-get install --no-install-recommends -y libfuse2t64 || true

      - name: Install Node dependencies
        run: npm ci

      - name: Set Release Environment
        id: set_env
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "PREFIX=ICCery_${TAG}-${SHORT_SHA}-linux-x86_64" >> $GITHUB_ENV

      - name: Prepare platform-specific resources
        run: |
          echo "Removing Windows ArgyllCMS binaries to avoid bundling them in Linux packages..."
          rm -rf src-tauri/argyll/windows-x86_64

      - name: Build Tauri App
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
        run: npm run tauri build -- -v --bundles deb,appimage

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets

          # Stage Debian package
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$deb" ]; then
              cp "$deb" "release-assets/${PREFIX}.deb"
            fi
          done

          # Stage AppImage package
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$appimage" ]; then
              cp "$appimage" "release-assets/${PREFIX}.AppImage"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.PREFIX }}
          path: release-assets/*

      - name: Upload Release Assets to Gitea
        if: !cancelled()
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "Finding release for tag ${TAG}..."
          RELEASE_RESP=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" "${SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${TAG}")
          RELEASE_ID=$(echo "${RELEASE_RESP}" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          if [ -n "${RELEASE_ID}" ]; then
            echo "Found Release ID: ${RELEASE_ID}. Uploading Linux assets..."
            for f in release-assets/*; do
              if [ -f "$f" ]; then
                FILENAME=$(basename "$f")
                echo "Uploading $FILENAME to release ${RELEASE_ID}..."
                curl -s -X POST \
                  -H "Authorization: token ${GITEA_TOKEN}" \
                  -H "Content-Type: multipart/form-data" \
                  -F "attachment=@$f" \
                  "${SERVER_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}"
              fi
            done
          else
            echo "No existing release found for tag ${TAG}. Skipping asset upload."
          fi
