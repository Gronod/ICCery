name: Build macOS Packages

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - development

jobs:
  build-macos:
    name: Build macOS (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: Intel
            os: macos-13
            target: x86_64-apple-darwin
            binary_dir: macos-x86_64
          - name: Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            binary_dir: macos-aarch64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check sidecar binaries
        run: |
          if [ ! -d "src-tauri/argyll/${{ matrix.platform.binary_dir }}" ]; then
            echo "Warning: macOS ArgyllCMS binaries not found. Please ensure they are downloaded/committed to src-tauri/argyll/${{ matrix.platform.binary_dir }} before release."
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Get App Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "APP_VERSION=${TAG#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
            echo "RELEASE_TAG=v${VERSION}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=${VERSION}-dev" >> $GITHUB_ENV
          fi

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload DMG
        uses: actions/upload-artifact@v3
        with:
          name: iccery-macos-${{ matrix.platform.name }}-dmg-${{ env.APP_VERSION }}
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload App Bundle
        uses: actions/upload-artifact@v3
        with:
          name: iccery-macos-${{ matrix.platform.name }}-app-${{ env.APP_VERSION }}
          path: src-tauri/target/release/bundle/macos/*.app

      - name: Upload Release Assets to Gitea
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && !cancelled()
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "Finding release for tag ${RELEASE_TAG}..."
          RELEASE_RESP=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" "${SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${RELEASE_TAG}")
          RELEASE_ID=$(echo "${RELEASE_RESP}" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          if [ -n "${RELEASE_ID}" ]; then
            echo "Found Release ID: ${RELEASE_ID}. Uploading macOS assets..."
            for f in src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app; do
              if [ -e "$f" ]; then
                FILENAME=$(basename "$f")
                echo "Uploading $FILENAME to release ${RELEASE_ID}..."
                curl -s -X POST \
                  -H "Authorization: token ${GITEA_TOKEN}" \
                  -H "Content-Type: multipart/form-data" \
                  -F "attachment=@$f" \
                  "${SERVER_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}"
              fi
            done
          else
            echo "No existing release found for tag ${RELEASE_TAG}. Skipping asset upload."
          fi
