name: Build Linux Packages

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: "true"
      RUST_BACKTRACE: "1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils squashfs-tools zsync libxss-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libxcursor-dev libxi-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Node dependencies
        run: npm ci

      - name: Get App Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=${VERSION}-dev" >> $GITHUB_ENV
          fi

      - name: Build Tauri App
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- -v

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: iccery-linux-deb-${{ env.APP_VERSION }}
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iccery-linux-appimage-${{ env.APP_VERSION }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
