name: Build macOS Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary_dir: macos-x86_64
            arch: x86_64
          - name: Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            binary_dir: macos-aarch64
            arch: aarm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check sidecar binaries
        run: |
          if [ ! -d "src-tauri/argyll/${{ matrix.platform.binary_dir }}" ]; then
            echo "Warning: macOS ArgyllCMS binaries not found. Please ensure they are downloaded/committed to src-tauri/argyll/${{ matrix.platform.binary_dir }} before release."
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Set Release Environment
        id: set_env
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "PREFIX=ICCery_${TAG}-${SHORT_SHA}-macos-${{ matrix.platform.arch }}" >> $GITHUB_ENV

      - name: Build Tauri App
        run: npm run tauri build

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          
          # Stage DMG package
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$dmg" ]; then
              cp "$dmg" "release-assets/${PREFIX}.dmg"
            fi
          done

          # Stage ZIP archive of .app bundle
          for app in src-tauri/target/release/bundle/macos/*.app; do
            if [ -d "$app" ]; then
              (cd src-tauri/target/release/bundle/macos && zip -r "../../../../../release-assets/${PREFIX}.zip" "$(basename "$app")")
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREFIX }}
          path: release-assets/*

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
